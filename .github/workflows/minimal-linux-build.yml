name: Minimal Linux Build

on:
  push:
    branches:
      - feature/smart-abbreviation-phase2
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libboost-all-dev libfreetype6-dev

      - name: Configure minimal RDKit build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRDK_BUILD_PYTHON_WRAPPERS=OFF \
            -DRDK_BUILD_CPP_TESTS=ON \
            -DRDK_BUILD_COORDGEN_SUPPORT=OFF \
            -DRDK_BUILD_MAEPARSER_SUPPORT=OFF \
            -DRDK_BUILD_CHEMDRAW_SUPPORT=OFF \
            -DRDK_BUILD_PUBCHEMSHAPE_SUPPORT=OFF \
            -DRDK_BUILD_DESCRIPTORS3D=OFF \
            -DRDK_USE_BOOST_SERIALIZATION=OFF \
            -DRDK_USE_BOOST_IOSTREAMS=OFF \
            -DRDK_INSTALL_STATIC_LIBS=OFF \
            -DRDK_INSTALL_INTREE=OFF

      - name: Build advanced depiction targets
        run: |
          cmake --build build --target \
            AdvancedDepiction \
            advancedDepictorCatch \
            advancedDepictionCatch \
            --parallel 2

      - name: Run advanced depiction tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            -R 'advancedDepictorCatch|advancedDepictionCatch'
